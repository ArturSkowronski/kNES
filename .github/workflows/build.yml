name: Java CI

# One run per change: pull_request covers every branch on its way in, push covers
# master after the merge. Triggering both on "**" ran this job twice per PR.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4
    
    - name: Build with Gradle
      run: ./gradlew build
