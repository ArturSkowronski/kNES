/*
 * Shared Kotlin/JVM setup for every module.
 *
 * Applied as:
 *
 *     apply from: "$rootDir/gradle/conventions/kotlin-module.gradle"
 *
 * Every module targets Java 17. The core used to sit on 11 while the tooling was on 17,
 * with nothing recording why; task F2 settled it on 17 throughout.
 *
 * Scope is Kotlin/JVM settings only. Test framework selection stays with the module:
 * not every module runs on the JUnit Platform, and applying it everywhere breaks the
 * ones that do not depend on its launcher.
 *
 * Kotlin compile tasks are matched by class name rather than by type: a script plugin
 * applied with `apply from:` does not get the Kotlin Gradle plugin on its own compile
 * classpath, so `import org.jetbrains.kotlin.gradle.tasks.KotlinCompile` will not
 * resolve here. A buildSrc convention plugin could import it, at the cost of a whole
 * extra build.
 */

def knesTarget = '17'

repositories {
    mavenCentral()
}

kotlin {
    jvmToolchain(knesTarget.toInteger())
}

tasks.matching { it.class.name.contains('KotlinCompile') }.configureEach { compileTask ->
    compileTask.kotlinOptions {
        jvmTarget = knesTarget
        apiVersion = '2.3'
        languageVersion = '2.3'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(knesTarget.toInteger())
    }
}
